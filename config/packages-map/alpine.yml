# QXDC — Mapeamento de pacotes para Alpine Linux
# Formato: nome_debian: nome_alpine
# Se o pacote não existe no Alpine, usar "~" (ignorar) ou substituição funcional.
# Repositórios: main, community, testing (indicado em comentário quando necessário)

# --- Ferramentas base ---
apt-transport-https: ~
curl: curl
wget: wget
git: git
htop: htop
btop: btop
net-tools: net-tools
unzip: unzip
unrar-free: unrar
lsb-release: ~
locate: mlocate
bash-completion: bash-completion
xclip: xclip

# --- Desktop / XFCE ---
gnome-disk-utility: gnome-disk-utility
galculator: galculator
menulibre: ~
flameshot: flameshot
xfce4-clipman-plugin: xfce4-clipman-plugin
xfce4-screenshooter: xfce4-screenshooter

# --- Fontes ---
fonts-noto: font-noto
fonts-noto-color-emoji: font-noto-emoji
fonts-lyx: ~

# --- Tema e visual ---
arc-theme: arc-theme                  # testing
gnome-themes-extra: gnome-themes-extra
gtk2-engines-murrine: gtk-murrine-engine  # nota: gist usa gtk-murrine-engine
papirus-icon-theme: papirus-icon-theme

# --- Multimídia ---
vlc: vlc

# --- Apps ---
keepassxc: keepassxc
