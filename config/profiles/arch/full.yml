# Perfil: arch-live
# Desktop XFCE leve para Arch Linux (instalação mínima ou live USB).
# Pacotes nomeados conforme repositórios oficiais Arch (extra/core).
# Itens AUR indicados em comentário (requerem yay/paru).

packages:
  install:
    - curl
    - wget
    - git
    - htop
    - btop
    - net-tools
    - unzip
    - unrar
    - plocate
    - bash-completion
    - xclip
    - openssh
    - rsync
    - noto-fonts
    - noto-fonts-emoji
    - galculator
    - keepassxc
    - flameshot
    - xfce4-clipman-plugin
    - xfce4-whiskermenu-plugin
    - papirus-icon-theme
    - arc-gtk-theme
    - gtk-engine-murrine
    - gnome-themes-extra
    - mousepad
    - thunar
    - firefox
    - fastfetch
  purge:
    - xterm

desktop:
  gtk_theme: Arc-Lighter
  wm_theme: Arc-Lighter
  icons: Papirus-Dark
  papirus_folders_color: paleorange
  font: Noto Sans 10
  monospace_font: JetBrains Mono 10
  cursor_theme: Adwaita
  workspaces: 1
  thunar_location_bar: ThunarLocationButtons
  app_menu: whiskermenu
  desktop_right_click_menu: false
  icons_show_home: false
  icons_show_trash: false
  icons_show_filesystem: false
  icons_show_removable: true
  panel2_background_alpha: 12
  wallpaper_url: https://raw.githubusercontent.com/luizfpq/QXDC-docs/main/main-wallpaper.jpg

apps:
  browser: firefox
  browser_theme: arc
  editor: mousepad
  terminal: xfce4-terminal
