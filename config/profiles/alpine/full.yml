# Perfil: alpine-live
# Desktop XFCE leve para Alpine Linux (live USB ou instalação mínima).
# Pacotes nomeados conforme repositórios Alpine (main + community).
# arc-theme requer testing (habilitado automaticamente via enable_nonfree_repos).

packages:
  install:
    # --- Display server + drivers ---
    - xorg-server
    - xf86-input-libinput
    - xf86-video-fbdev
    - xf86-video-ati
    - mesa-dri-gallium
    - eudev
    # --- Desktop environment ---
    - xfce4
    - xfce4-terminal
    - xfce4-clipman-plugin
    - xfce4-whiskermenu-plugin
    - lightdm-gtk-greeter
    # --- Session management ---
    - elogind
    - polkit-elogind
    - dbus
    # --- Audio ---
    - pipewire
    - pipewire-pulse
    - pipewire-alsa
    - wireplumber
    # --- Network ---
    - networkmanager
    - networkmanager-wifi
    # --- Visual / tema ---
    - papirus-icon-theme
    - arc-theme
    - font-noto
    - font-noto-emoji
    # --- Ferramentas ---
    - curl
    - wget
    - git
    - htop
    - btop
    - net-tools
    - unzip
    - bash-completion
    - xclip
    - openssh
    - rsync
    - galculator
    - keepassxc
    - flameshot
    - mousepad
    - thunar
    - firefox
    - fastfetch
  purge:
    - xterm

  # Serviços a habilitar no boot (Alpine OpenRC)
  services:
    - dbus
    - elogind
    - lightdm
    - networkmanager
    - udev

  # Módulos de kernel a carregar no boot (Alpine /etc/modules)
  kernel_modules:
    - evdev
    - hid-generic
    - usbhid
    - i8042
    - atkbd
    - psmouse

  # Ajustes pós-instalação (Alpine-specific)
  tweaks:
    - lightdm-no-check-graphical

desktop:
  gtk_theme: Arc-Lighter
  wm_theme: Arc-Lighter
  icons: Papirus-Dark
  papirus_folders_color: paleorange
  font: Noto Sans 10
  monospace_font: JetBrains Mono 10
  cursor_theme: Adwaita
  workspaces: 1
  thunar_location_bar: ThunarLocationButtons
  app_menu: whiskermenu
  desktop_right_click_menu: false
  icons_show_home: false
  icons_show_trash: false
  icons_show_filesystem: false
  icons_show_removable: true
  panel2_background_alpha: 12
  wallpaper_url: https://raw.githubusercontent.com/luizfpq/QXDC-docs/main/main-wallpaper.jpg

apps:
  browser: firefox
  browser_theme: arc
  editor: mousepad
  terminal: xfce4-terminal
